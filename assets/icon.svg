<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     fill="none"
     role="img"
     aria-labelledby="title">
  <title id="title">DSH Unity MCP</title>
  <style>
    .cube { stroke: #3B8EF8; stroke-width: 3; }
    .face { fill: #3B8EF8; fill-opacity: 0.18; }
    .dot  { fill: #1D5CCC; }

    @media (prefers-color-scheme: dark) {
      .cube { stroke: #579FFF; }
      .face { fill: #579FFF; fill-opacity: 0.18; }
      .dot  { fill: #9DD4FF; }
    }
  </style>
  <!-- The cube: the Unity Editor the relay rides on. -->
  <polygon class="face" points="32,6 54,19 54,45 32,58 10,45 10,19" />
  <path class="cube" d="M32 6 L54 19 L54 45 L32 58 L10 45 L10 19 Z" />
  <!-- The bridge: the stdio line that carries the MCP frames. -->
  <path class="cube" d="M10 19 L32 32 L54 19 M32 32 L32 58" />
  <circle class="dot" cx="32" cy="32" r="4" />
</svg>
